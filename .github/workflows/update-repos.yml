name: Atualizar Tabela de Repositórios

on:
  schedule:
    - cron: '0 */6 * * *' # Roda automaticamente a cada 6 horas
  workflow_dispatch:       # Permite rodar manualmente pela aba Actions
  push:
    branches: [ main ]     # Roda sempre que você editar a branch main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Gerar tabela de repositórios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: sxbrinz
        run: |
          python3 - << 'EOF'
          import os, urllib.request, json, re

          username = os.environ["USERNAME"]
          url = f"https://api.github.com/users/{username}/repos?sort=updated&per_page=100"
          req = urllib.request.Request(url, headers={"User-Agent": "GitHub-Action"})
          with urllib.request.urlopen(req) as resp:
              repos = json.loads(resp.read().decode())

          linhas = [
              "| Repositório | Descrição | Linguagem | Atualizado em |",
              "| :--- | :--- | :--- | :--- |"
          ]

          for repo in repos:
              # Ignora forks e o próprio repo de perfil (sxbrinz/sxbrinz)
              if repo["fork"] or repo["name"].lower() == username.lower():
                  continue
              nome = f"[{repo['name']}]({repo['html_url']})"
              desc = (repo["description"] or "Sem descrição").replace("|", "-")
              lang = repo["language"] or "-"
              data = repo["updated_at"][:10]
              linhas.append(f"| {nome} | {desc} | {lang} | {data} |")

          tabela = "\n".join(linhas)

          with open("README.md", "r", encoding="utf-8") as f:
              conteudo = f.read()

          novo_conteudo = re.sub(
              r"<!-- REPOS_START -->.*?<!-- REPOS_END -->",
              f"<!-- REPOS_START -->\n{tabela}\n<!-- REPOS_END -->",
              conteudo,
              flags=re.DOTALL
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(novo_conteudo)
          EOF

      - name: Salvar alterações no README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualiza tabela de repositórios" && git push)
